# Posts each newly published release to the #releases channel on Discord. Needs the channel's
# webhook URL in the DISCORD_RELEASES_WEBHOOK secret; without it this does nothing.
# Run it by hand to repost a release, or to rewrite an earlier post by giving its message id.
name: Announce on Discord
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.5-beta.4
        required: true
      message_id:
        description: Discord message to rewrite instead of posting a new one (optional)
        required: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post to #releases
        env:
          HOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          MESSAGE: ${{ inputs.message_id }}
        run: |
          if [ -z "$HOOK" ]; then echo "DISCORD_RELEASES_WEBHOOK isn't set; skipping"; exit 0; fi
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          name=$(jq -r .name <<<"$release")
          url=$(jq -r .html_url <<<"$release")
          notes=$(jq -r .body <<<"$release" | tr -d '\r')
          head=$(printf '**%s is out**' "$name")
          foot=$(printf 'Download and full notes: %s\nDocs: https://clutch.destrosphere.com' "$url")
          # Discord messages are capped at 2000 characters. Long notes keep as many whole lines
          # (bullets) as fit, drop a heading left with nothing under it, and point to the rest.
          # The download lines (**Windows…, **Linux…) always stay, after the bullets.
          room=$(( 1990 - ${#head} - ${#foot} - 4 ))
          more=$'\n\n…and more in the full notes.'
          if [ ${#notes} -gt $room ]; then
            files=$(grep -E '^\*\*(Windows|Linux)' <<<"$notes" || true)
            notes=$(awk -v room=$(( room - ${#more} - ${#files} - 2 )) '
              /^\*\*(Windows|Linux)/ { exit }
              { if (n + length($0) + 1 > room) exit; out[++k] = $0; n += length($0) + 1 }
              END { while (k > 0 && (out[k] == "" || out[k] ~ /:$/)) k--; for (i = 1; i <= k; i++) print out[i] }
            ' <<<"$notes")
            if [ -n "$files" ]; then notes=$(printf '%s\n\n%s' "$notes" "$files"); fi
            notes="$notes$more"
          fi
          text=$(printf '%s\n\n%s\n\n%s' "$head" "$notes" "$foot")
          # flags 4 hides link previews so the post stays compact.
          body=$(jq -n --arg c "$text" '{username: "Clutch", content: $c, flags: 4, allowed_mentions: {parse: []}}')
          if [ -n "$MESSAGE" ]; then
            curl -fsS -X PATCH -H 'Content-Type: application/json' -d "$(jq 'del(.username)' <<<"$body")" "$HOOK/messages/$MESSAGE" >/dev/null
          else
            curl -fsS -H 'Content-Type: application/json' -d "$body" "$HOOK" >/dev/null
          fi
